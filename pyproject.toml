[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workvault"
version = "0.1.0"
description = "Local-first terminal, AI-session, and repository provenance tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wv = "workvault.cli:main"
workvault = "workvault.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
